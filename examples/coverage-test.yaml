openapi: 3.0.3
info:
  title: Coverage Test API
  version: 1.0.0

# Root server: a non-default port (8000) and a base path (/api/v1) that the matcher must strip.
servers:
  - url: http://localhost:8000/api/v1

paths:
  /users:
    get:
      summary: List users
      responses:
        '200': { description: ok }
    post:
      summary: Create user
      responses:
        '201': { description: created }

  # Literal route that is ambiguous with /users/{id} — the literal must win for "/users/me".
  /users/me:
    get:
      summary: Current user
      responses:
        '200': { description: ok }

  /users/{id}:
    get:
      summary: Get user
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: ok }
    delete:
      summary: Delete user
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: deleted }

  /users/{id}/posts/{postId}:
    get:
      summary: Get a user's post (nested params)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: postId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: ok }

  # Partial-segment templating: the ".json" suffix is literal.
  /files/{name}.json:
    get:
      summary: Get a JSON file
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: ok }

  /health:
    get:
      summary: Health check (plain literal)
      responses:
        '200': { description: ok }

  /search:
    get:
      summary: Search (query params must be ignored by matching)
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: ok }

  # Operation-level server override: different host (127.0.0.1) and NO base path.
  /legacy:
    get:
      summary: Legacy endpoint on another host
      servers:
        - url: http://127.0.0.1:8000
      responses:
        '200': { description: ok }
